[workspace]
members = ["examples/audio_visualizer", "tests/mounted"]
resolver = "2"

[package]
name = "waterui-visualizer"
version = "0.5.0"
edition = "2024"
rust-version = "1.99"
authors = ["Lexo Liu <me@lexo.cool>"]
license = "Apache-2.0 OR MIT"
readme = "README.md"
repository = "https://github.com/water-rs/visualizer"
description = "Real-time audio visualization components for WaterUI"
keywords = ["audio", "visualizer", "waveform", "spectrum"]
categories = ["multimedia", "gui", "visualization"]

[lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"
multiple_crate_versions = "allow"

# `waterui_graphics::canvas` arrives in the framework after 0.5.1, and nami's
# `scan` combinator after nami 0.13.0; the `[patch.crates-io]` table below
# resolves both from their `dev` branches until a release carries them.
[dependencies]
waterui-core = { version = "0.5.1" }
waterui-graphics = { version = "0.5.1", default-features = false }
waterkit-audio = { version = "0.1.2", features = ["recording"] }
kurbo = "0.13"
realfft = "3.5"
async-channel = "2.5"
blocking = "1.7.0"
executor-core = "0.7.1"
futures = "0.3"
tracing = "0.1.44"

[dev-dependencies]
waterui = "0.5.2"
waterui-testing = "0.5.1"

# Third-party forks and unreleased water-rs crates the framework itself
# patches; a registry dependency does not carry its own patch table, so they
# are repeated here so this graph resolves the same sources as
# water-rs/waterui's `dev`, with the exact commit recorded in `Cargo.lock`.
# It carries the Canvas API (`waterui_graphics::canvas`,
# water-rs/waterui#4054), which the crate draws through.
[patch.crates-io]
xcb = { git = "https://github.com/rust-x-bindings/rust-xcb", rev = "ae3b2cd080e78173223038ccbebdc644eaf4a9ad" }
block = { git = "https://github.com/Dicklesworthstone/rust-block", rev = "b39ae859d1ee8e8cb5eef6a516471f1578d26b96" }

# nami 0.13.0 predates the `scan` combinator (water-rs/nami#64) the spectrum
# analysis is derived with. All three nami crates ride `dev` so the graph
# carries one `Signal` trait. Drop once a release carries `scan`.
nami = { git = "https://github.com/water-rs/nami", branch = "main" }
nami-core = { git = "https://github.com/water-rs/nami", branch = "main" }
nami-derive = { git = "https://github.com/water-rs/nami", branch = "main" }

# suiteki 0.1.1 on crates.io implements nami-core 0.3's `Signal`; suiteki's
# `dev` implements 0.5's (water-rs/suiteki#29), the source the framework's own
# patch table names. Drop once a release carries it.
suiteki = { git = "https://github.com/water-rs/suiteki", branch = "main" }

# Every `waterui-*` crate in the graph must resolve to this one commit — a
# registry `waterui-core` beside the facade's own path dependencies gives two
# `View` traits in one graph.
waterui = { git = "https://github.com/water-rs/waterui", branch = "dev" }
waterui-assets = { git = "https://github.com/water-rs/waterui", branch = "dev" }
waterui-assets-core = { git = "https://github.com/water-rs/waterui", branch = "dev" }
waterui-assets-macros = { git = "https://github.com/water-rs/waterui", branch = "dev" }
waterui-assets-planner = { git = "https://github.com/water-rs/waterui", branch = "dev" }
waterui-backend-core = { git = "https://github.com/water-rs/waterui", branch = "dev" }
waterui-controls = { git = "https://github.com/water-rs/waterui", branch = "dev" }
waterui-core = { git = "https://github.com/water-rs/waterui", branch = "dev" }
waterui-dylib = { git = "https://github.com/water-rs/waterui", branch = "dev" }
waterui-form = { git = "https://github.com/water-rs/waterui", branch = "dev" }
waterui-graphics = { git = "https://github.com/water-rs/waterui", branch = "dev" }
waterui-icon = { git = "https://github.com/water-rs/waterui", branch = "dev" }
waterui-inspector-protocol = { git = "https://github.com/water-rs/waterui", branch = "dev" }
waterui-internal = { git = "https://github.com/water-rs/waterui", branch = "dev" }
waterui-layout = { git = "https://github.com/water-rs/waterui", branch = "dev" }
waterui-locale = { git = "https://github.com/water-rs/waterui", branch = "dev" }
waterui-macros = { git = "https://github.com/water-rs/waterui", branch = "dev" }
waterui-map = { git = "https://github.com/water-rs/waterui", branch = "dev" }
waterui-media = { git = "https://github.com/water-rs/waterui", branch = "dev" }
waterui-navigation = { git = "https://github.com/water-rs/waterui", branch = "dev" }
waterui-preview-protocol = { git = "https://github.com/water-rs/waterui", branch = "dev" }
waterui-shape = { git = "https://github.com/water-rs/waterui", branch = "dev" }
waterui-testing = { git = "https://github.com/water-rs/waterui", branch = "dev" }
waterui-text = { git = "https://github.com/water-rs/waterui", branch = "dev" }
waterui-url = { git = "https://github.com/water-rs/waterui", branch = "dev" }
waterui-video = { git = "https://github.com/water-rs/waterui", branch = "dev" }
waterui-watcher-set = { git = "https://github.com/water-rs/waterui", branch = "dev" }
waterui-webview = { git = "https://github.com/water-rs/waterui", branch = "dev" }

# Extracted component crates the facade names as optional dependencies,
# riding their migrated `main` branches.
waterui-barcode = { git = "https://github.com/water-rs/barcode", branch = "main" }
waterui-chart = { git = "https://github.com/water-rs/chart", branch = "main" }
waterui-image = { git = "https://github.com/water-rs/image", branch = "main" }
waterui-map-gpu = { git = "https://github.com/water-rs/map-gpu", branch = "main" }
waterui-math = { git = "https://github.com/water-rs/math", branch = "main" }
waterui-particle = { git = "https://github.com/water-rs/particle", branch = "main" }
waterui-svg = { git = "https://github.com/water-rs/svg", branch = "main" }
waterui-video-gpu = { git = "https://github.com/water-rs/video-gpu", branch = "main" }

# The mounted test graph's backend pair: `hydrolysis` lives in-tree at
# `backends/hydrolysis`, so it resolves from the same framework commit as
# every `waterui-*` crate; its Material 3 theme rides `main`.
hydrolysis = { git = "https://github.com/water-rs/waterui", branch = "dev" }
hydrolysis-m3 = { git = "https://github.com/water-rs/hydrolysis-m3", branch = "main" }

# `cherenkov` is unpublished; like the framework's own table, this entry
# resolves a registry `cherenkov = "0.0.0"` requirement to the in-tree
# engine at the framework's commit.
cherenkov = { git = "https://github.com/water-rs/waterui", branch = "dev" }

# Every waterkit crate in the graph rides the same commit — a registry
# `waterkit-core` beside a patched sibling is a second source of the types
# they share. The source is waterkit's `dev`, the one water-rs/waterui's patch
# table names; `Cargo.lock` records the exact commit.
waterkit-build = { git = "https://github.com/water-rs/waterkit", branch = "main" }
waterkit-camera = { git = "https://github.com/water-rs/waterkit", branch = "main" }
waterkit-clipboard = { git = "https://github.com/water-rs/waterkit", branch = "main" }
waterkit-codec = { git = "https://github.com/water-rs/waterkit", branch = "main" }
waterkit-dialog = { git = "https://github.com/water-rs/waterkit", branch = "main" }
waterkit-fs = { git = "https://github.com/water-rs/waterkit", branch = "main" }
waterkit-haptic = { git = "https://github.com/water-rs/waterkit", branch = "main" }
waterkit-location = { git = "https://github.com/water-rs/waterkit", branch = "main" }
waterkit-permission = { git = "https://github.com/water-rs/waterkit", branch = "main" }
waterkit-screen = { git = "https://github.com/water-rs/waterkit", branch = "main" }
waterkit-audio = { git = "https://github.com/water-rs/waterkit", branch = "main" }
waterkit-core = { git = "https://github.com/water-rs/waterkit", branch = "main" }
waterkit-video = { git = "https://github.com/water-rs/waterkit", branch = "main" }
waterkit-video-container = { git = "https://github.com/water-rs/waterkit", branch = "main" }
waterkit-video-core = { git = "https://github.com/water-rs/waterkit", branch = "main" }
waterkit-video-player = { git = "https://github.com/water-rs/waterkit", branch = "main" }
waterkit-video-streaming = { git = "https://github.com/water-rs/waterkit", branch = "main" }

# The engine's shader build step follows shaderloom's `dev`, as the framework's
# own table does.
shaderloom = { git = "https://github.com/water-rs/shaderloom", branch = "main" }

# Mirrored from water-rs/waterui's workspace [patch.crates-io] (itself
# mirrored from the cherenkov workspace's table, water-rs/cherenkov#229).
# wgpu 30.0.1's Metal backend reads the address of the kCGColorSpace* globals
# instead of their value and crashes in CGColorSpaceCreateWithName whenever a
# surface negotiates Extended Display P3 or BT.2100 (gfx-rs/wgpu#10175, fixed on
# trunk, not yet released for v30). The fork carries only that backport on the
# v30.0.1 tag, adds the passthrough threadgroup-memory metadata the engine's
# Metal shaders declare and moves wgpu-hal to glow 0.18; drop these entries once
# a wgpu-hal release ships all three.
naga = { git = "https://github.com/water-rs/wgpu", branch = "fix/metal-shared-memory-v30" }
naga-types = { git = "https://github.com/water-rs/wgpu", branch = "fix/metal-shared-memory-v30" }
wgpu = { git = "https://github.com/water-rs/wgpu", branch = "fix/metal-shared-memory-v30" }
wgpu-core = { git = "https://github.com/water-rs/wgpu", branch = "fix/metal-shared-memory-v30" }
wgpu-core-deps-apple = { git = "https://github.com/water-rs/wgpu", branch = "fix/metal-shared-memory-v30" }
wgpu-core-deps-emscripten = { git = "https://github.com/water-rs/wgpu", branch = "fix/metal-shared-memory-v30" }
wgpu-core-deps-windows-linux-android = { git = "https://github.com/water-rs/wgpu", branch = "fix/metal-shared-memory-v30" }
wgpu-hal = { git = "https://github.com/water-rs/wgpu", branch = "fix/metal-shared-memory-v30" }
wgpu-naga-bridge = { git = "https://github.com/water-rs/wgpu", branch = "fix/metal-shared-memory-v30" }
wgpu-types = { git = "https://github.com/water-rs/wgpu", branch = "fix/metal-shared-memory-v30" }
# wgpu-external-frame hands wgpu-hal's GLES textures to its own glow context, so
# it must link the glow 0.18 the branch above carries.
wgpu-external-frame = { git = "https://github.com/water-rs/wgpu-external-frame", branch = "main" }
