[workspace]
members = ["examples/audio_visualizer"]
resolver = "2"

[package]
name = "waterui-visualizer"
version = "0.3.0"
edition = "2024"
rust-version = "1.95"
authors = ["Lexo Liu <me@lexo.cool>"]
license = "Apache-2.0 OR MIT"
readme = "README.md"
repository = "https://github.com/water-rs/visualizer"
description = "Real-time audio visualization components for WaterUI"
keywords = ["audio", "visualizer", "waveform", "spectrum"]
categories = ["multimedia", "gui", "visualization"]

[lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"
multiple_crate_versions = "allow"

[dependencies]
waterui-core = { version = "0.3.2" }
waterui-graphics = { version = "0.4.1", default-features = false }
waterkit-audio = { version = "0.1.2", features = ["recording"] }
kurbo = "0.13"
peniko = "0.6"
realfft = "3.5"
async-channel = "2.5"
blocking = "1.7.0"
executor-core = "0.7.1"
futures = "0.3"
tracing = "0.1.44"

[dev-dependencies]
pollster = "1.0"
waterui = "0.4.1"
waterui-testing = "0.4.1"
# The offscreen scene-export tests rasterize through a real GPU surface, which
# is `waterui-graphics`' `gpu` half rather than the scene contract the library
# itself draws through.
waterui-graphics = { version = "0.4.1", features = ["gpu"] }

# The WaterUI packages above come from crates.io, so this repository builds
# against the same released APIs its users get. The third-party pins below are
# the framework's own: the published `waterui-graphics` was built with these
# forks, and dropping them here would render this crate's tests through
# different code than the framework runs.
[patch.crates-io]
xcb = { git = "https://github.com/rust-x-bindings/rust-xcb", rev = "ae3b2cd080e78173223038ccbebdc644eaf4a9ad" }
vello = { git = "https://github.com/lexoliu/vello", rev = "5e5f538556be16527f67379b105af82f408b747d" }
vello_hybrid = { git = "https://github.com/lexoliu/vello", rev = "d68d9e9825bcd1ffee762323881c13a2e7a3f639" }
vello_common = { git = "https://github.com/lexoliu/vello", rev = "d68d9e9825bcd1ffee762323881c13a2e7a3f639" }
vello_sparse_shaders = { git = "https://github.com/lexoliu/vello", rev = "d68d9e9825bcd1ffee762323881c13a2e7a3f639" }
glifo = { git = "https://github.com/lexoliu/vello", rev = "d68d9e9825bcd1ffee762323881c13a2e7a3f639" }
