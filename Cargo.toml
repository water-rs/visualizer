shaderloom = { git = "https://github.com/water-rs/shaderloom", rev = "b0b6870c8b560d902c1de9a4d039c3a921b18b92" }

# The suite's vello baseline is the fork WaterUI and Hydrolysis ship, not
# crates.io: `vello` carries the Mali Vulkan device-loss fix
# (linebender/vello#1817) plus the glifo canonical-location hint-cache fix and
# the bump-buffer overflow re-render, and the sparse-strip crates and glifo sit
# on the canonical-location fix — the revs the framework's own table pins.
vello = { git = "https://github.com/lexoliu/vello", rev = "76292095f408cf04b901023c2053f8d424652f06" }
vello_hybrid = { git = "https://github.com/lexoliu/vello", rev = "a01e5039c290fa869e0f6f3708e621056740f49b" }
vello_common = { git = "https://github.com/lexoliu/vello", rev = "a01e5039c290fa869e0f6f3708e621056740f49b" }
vello_sparse_shaders = { git = "https://github.com/lexoliu/vello", rev = "a01e5039c290fa869e0f6f3708e621056740f49b" }
glifo = { git = "https://github.com/lexoliu/vello", rev = "a01e5039c290fa869e0f6f3708e621056740f49b" }

# wgpu 30.0.1's Metal backend reads the address of the kCGColorSpace* globals
# instead of their value and crashes in CGColorSpaceCreateWithName whenever a
# surface negotiates Extended Display P3 or BT.2100 (gfx-rs/wgpu#10175, fixed on
# trunk, not yet released for v30). Mirrored from the in-tree cherenkov
# workspace patch (water-rs/cherenkov#229, carried into water-rs/waterui):
# `[patch]` in a dependency's manifest does not apply downstream, so without
# these entries this graph resolves the crashing crates.io build while the
# engine resolves the fork. Drop them once wgpu-hal 30.0.2 ships the backport.
naga = { git = "https://github.com/water-rs/wgpu", rev = "4b35d8bc968f6968b3cbae65b6e2e2ee132aa038" }
