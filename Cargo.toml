[workspace]
members = ["examples/audio_visualizer"]
resolver = "2"

[package]
name = "waterui-visualizer"
version = "0.5.0"
edition = "2024"
rust-version = "1.95"
authors = ["Lexo Liu <me@lexo.cool>"]
license = "Apache-2.0 OR MIT"
readme = "README.md"
repository = "https://github.com/water-rs/visualizer"
description = "Real-time audio visualization components for WaterUI"
keywords = ["audio", "visualizer", "waveform", "spectrum"]
categories = ["multimedia", "gui", "visualization"]

[lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"
multiple_crate_versions = "allow"

[dependencies]
waterui-core = { version = "0.3.2" }
waterui-graphics = { version = "0.4.1", default-features = false }
waterkit-audio = { version = "0.1.2", features = ["recording"] }
kurbo = "0.13"
peniko = "0.6"
realfft = "3.5"
async-channel = "2.5"
blocking = "1.7.0"
executor-core = "0.7.1"
futures = "0.3"
tracing = "0.1.44"

[dev-dependencies]
pollster = "1.0"
waterui = "0.4.1"
waterui-testing = "0.4.1"
# The offscreen scene-export tests rasterize through a real GPU surface, which
# is `waterui-graphics`' `gpu` half rather than the scene contract the library
# itself draws through.
waterui-graphics = { version = "0.4.1", features = ["gpu"] }

# The waterui 0.5.0 release is in its candidate window: the `waterui-*`
# requirements above name the versions the pinned revision provides, and every
# `waterui-*` member this graph resolves comes from that one commit so the
# graph carries exactly one copy of each — a registry crate beside its git
# twin would compile duplicate `View`/`Layout` types. Drop the entries and
# bump the requirements to the released versions once 0.5.0 is on crates.io.
[patch.crates-io]
waterui-svg = { git = "https://github.com/water-rs/svg", rev = "79493d096341faf630e03350f22db73c07bb3b3a" }
waterui = { git = "https://github.com/water-rs/waterui", rev = "f3f58c48f553c0eb198338fcfd79341e5973c0ed" }
waterui-assets = { git = "https://github.com/water-rs/waterui", rev = "f3f58c48f553c0eb198338fcfd79341e5973c0ed" }
waterui-assets-core = { git = "https://github.com/water-rs/waterui", rev = "f3f58c48f553c0eb198338fcfd79341e5973c0ed" }
waterui-assets-macros = { git = "https://github.com/water-rs/waterui", rev = "f3f58c48f553c0eb198338fcfd79341e5973c0ed" }
waterui-assets-planner = { git = "https://github.com/water-rs/waterui", rev = "f3f58c48f553c0eb198338fcfd79341e5973c0ed" }
waterui-backend-core = { git = "https://github.com/water-rs/waterui", rev = "f3f58c48f553c0eb198338fcfd79341e5973c0ed" }
waterui-controls = { git = "https://github.com/water-rs/waterui", rev = "f3f58c48f553c0eb198338fcfd79341e5973c0ed" }
waterui-core = { git = "https://github.com/water-rs/waterui", rev = "f3f58c48f553c0eb198338fcfd79341e5973c0ed" }
waterui-form = { git = "https://github.com/water-rs/waterui", rev = "f3f58c48f553c0eb198338fcfd79341e5973c0ed" }
waterui-graphics = { git = "https://github.com/water-rs/waterui", rev = "f3f58c48f553c0eb198338fcfd79341e5973c0ed" }
waterui-icon = { git = "https://github.com/water-rs/waterui", rev = "f3f58c48f553c0eb198338fcfd79341e5973c0ed" }
waterui-inspector-protocol = { git = "https://github.com/water-rs/waterui", rev = "f3f58c48f553c0eb198338fcfd79341e5973c0ed" }
waterui-internal = { git = "https://github.com/water-rs/waterui", rev = "f3f58c48f553c0eb198338fcfd79341e5973c0ed" }
