[package]
name = "waterui-visualizer"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
authors = ["Lexo Liu <me@lexo.cool>"]
license = "Apache-2.0 OR MIT"
readme = "README.md"
repository = "https://github.com/water-rs/visualizer"
description = "Real-time audio visualization components for WaterUI"
keywords = ["audio", "visualizer", "waveform", "spectrum"]
categories = ["multimedia", "gui", "visualization"]

[lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"
multiple_crate_versions = "allow"

[dependencies]
waterui-core = { version = "0.3.0", git = "https://github.com/water-rs/waterui.git", branch = "dev" }
waterui-graphics = { version = "0.3.0", git = "https://github.com/water-rs/waterui.git", branch = "dev", default-features = false }
waterkit-audio = { version = "0.1.0", git = "https://github.com/water-rs/waterkit.git", branch = "dev", features = ["recording"] }
kurbo = "0.13"
peniko = "0.6"
realfft = "3.5"
async-channel = "2.5"
blocking = "1.7.0"
executor-core = "0.7.1"
futures = "0.3"
tracing = "0.1.44"

[dev-dependencies]
pollster = "1.0"
waterui = { git = "https://github.com/water-rs/waterui.git", branch = "dev" }
waterui-testing = { git = "https://github.com/water-rs/waterui.git", branch = "dev" }
# The offscreen scene-export tests rasterize through a real GPU surface, which
# is `waterui-graphics`' `gpu` half rather than the scene contract the library
# itself draws through.
waterui-graphics = { version = "0.3.0", git = "https://github.com/water-rs/waterui.git", branch = "dev", features = ["gpu"] }
